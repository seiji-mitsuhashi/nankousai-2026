function openPopup(
    title,
    className,
    wait,
    link
) {

    document.getElementById("popup")
        .style.display = "flex";

    document.getElementById("popup-title")
        .innerText = title;

    document.getElementById("popup-class")
        .innerText =
            "発表クラス：" + className;

    document.getElementById("popup-wait")
        .innerText =

    document.getElementById("popup-link")
        .href = link;
}

/* 外押したら閉じる */

document.getElementById("popup")
.addEventListener("click", function(e) {

    if(e.target.id === "popup") {

        this.style.display = "none";
    }

});

    const menu = document.getElementById("menu");

    if(menu.style.display === "block") {
        menu.style.display = "none";
    } else {
        menu.style.display = "block";
    }

}

function openRoom(
    title,
    content,
    link
){

    document
    .getElementById("popup-title")
    .innerText = title;

    document
    .getElementById("popup-content")
    .innerText = content;

    document
    .getElementById("popup-link")
    .href = link;

    document
    .getElementById("overlay")
    .style.display = "block";

    document
    .getElementById("room-popup")
    .style.display = "block";
}

function closePopup(){

    document
    .getElementById("overlay")
    .style.display = "none";

    document
    .getElementById("room-popup")
    .style.display = "none";
}
