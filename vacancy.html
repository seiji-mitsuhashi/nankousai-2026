<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

    <meta name="viewport"
content="width=device-width, initial-scale=1.0">

    <link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&display=swap"
rel="stylesheet">
<title>空き情報 | 南高祭2026</title>

<style>

/* ヘッダー */

.page-header {

    background: #00469b;

    padding: 15px 30px;

    display: flex;

    justify-content: space-between;

    align-items: center;
}

.site-title {

    color: white;

    text-decoration: none;

    font-size: 2rem;

    font-family:
        "Yuji Syuku",
        serif;
}

/* 3本線 */

.menu-button {

    color: white;

    font-size: 2rem;

    cursor: pointer;

    user-select: none;
}

/* メニュー */

#menu {

    display: none;

    position: absolute;

    top: 70px;

    right: 20px;

    background: white;

    border-radius: 15px;

    overflow: hidden;

    z-index: 9999;

    box-shadow:
        0 5px 15px rgba(0,0,0,0.2);

    max-height: 400px;

    overflow-y: auto;
}

#menu a {

    display: block;

    padding: 15px 30px;

    color: #00469b;

    text-decoration: none;

    transition: 0.3s;
}

#menu a:hover {

    background: #00469b;

    color: white;
}

body{
    margin:0;
    background:#f5f5f5;
    font-family:sans-serif;
}

/* ヘッダー */

header{
    background:#00469b;
    color:white;
    text-align:center;
    padding:20px;
}

h1{
    margin:0;
}

/* 全体 */

.container{

    width:90%;

    margin:40px auto;
}

/* 学年タイトル */

.grade-title{

    font-size:2rem;

    color:#00469b;

    margin-top:50px;

    margin-bottom:20px;
}

/* カード */

.wait-grid{

    display:grid;

    grid-template-columns:
        repeat(auto-fit,minmax(180px,220px));

    justify-content:center;

    gap:20px;
}

.wait-card{

    background:white;

    border-radius:20px;

    padding:18px;

    width:100%;

    min-height:160px;

    box-sizing:border-box;
}

.class-name{

    font-size:1.5rem;

    font-weight:bold;

    color:#00469b;

    margin-bottom:10px;
}

.wait-time{

    font-size:2rem;

    font-weight:bold;

    color:#e63946;

    margin-top:10px;
}

.groups{

    color:#666;

    margin-top:10px;
}

/* スマホ対応 */

@media (max-width:768px){

    /* ヘッダー */

    .page-header{

        padding:15px;
    }

    .site-title{

        font-size:1.4rem;
    }

    .menu-button{

        font-size:1.8rem;
    }

    /* メニュー */

    #menu{

        width:85%;

        right:10px;

        top:65px;
    }

    #menu a{

        padding:18px;
    }

    /* コンテンツ */

    .container{

        width:95%;

        margin:20px auto;
    }

    .grade-title{

        font-size:1.6rem;

        text-align:center;
    }

    /* カード */

    .wait-grid{

        grid-template-columns:
            repeat(2,1fr);

        gap:12px;
    }

    .wait-card{

        width:100%;

        min-height:auto;

        padding:15px;
    }

    .class-name{

        font-size:1.2rem;
    }

    .wait-time{

        font-size:1.5rem;
    }
}
</style>
</head>

<body>

<header class="page-header">

    <a href="home.html"
    class="site-title">

        南高祭2026

    </a>

    <div class="menu-button"
    onclick="toggleMenu()">

        ☰

    </div>

</header>

<nav id="menu">

    <a href="home.html">ホーム</a>

    <a href="access.html">交通アクセス</a>

    <a href="stage.html">ステージ発表</a>

    <a href="exhibition.html">展示一覧</a>

    <a href="map.html">会場マップ</a>

    <a href="vacancy.html">空き情報</a>

    <a href="3f.html">3F</a>

    <a href="4f.html">4F</a>

    <a href="5f.html">5F</a>

</nav>

<div class="container">

    <div id="grade1-area"></div>

    <div id="grade2-area"></div>

    <div id="grade3-area"></div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getDatabase,
ref,
onValue
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* Firebase設定 */

const firebaseConfig = {

apiKey: "ここ",

authDomain: "ここ",

projectId: "ここ",

storageBucket: "ここ",

messagingSenderId: "ここ",

appId: "ここ",

databaseURL:
"https://nankousai2026-default-rtdb.asia-southeast1.firebasedatabase.app"

};

const app =
initializeApp(firebaseConfig);

const db =
getDatabase(app);

/* 表示 */

const vacancyRef =
    ref(db,"vacancy");

onValue(vacancyRef,(snapshot)=>{

    const data =
        snapshot.val();

    createGrade("1年",data,"grade1-area");

    createGrade("2年",data,"grade2-area");

    createGrade("3年",data,"grade3-area");

});

/* 学年ごと */

function createGrade(grade,data,areaId){

    let html = `
    <div class="grade-title">
        ${grade}
    </div>

    <div class="wait-grid">
    `;

    for(let i = 1; i <= 8; i++){

        const className =
            grade + i + "組";

        const item =
            data && data[className]
            ? data[className]
            : null;

        html += `

        <div class="wait-card">

            <div class="class-name">
                ${className}
            </div>

            <div>
                待ち組数：
                ${
                    item
                    ? item.groups + "組"
                    : "ーーー"
                }
            </div>

            <div
class="wait-time"

style="
color:
${
    !item
    ? '#666'

    : item.waitTime < 20
    ? '#2ecc71'

    : item.waitTime < 40
    ? '#b59b3a'

    : '#e74c3c'
};
"
>

${
    item
    ? "約" + item.waitTime + "分"
    : "ーーー"
}

</div>

        </div>

        `;
    }

    html += `</div>`;

    document.getElementById(areaId)
        .innerHTML = html;
}

window.toggleMenu = function(){

    const menu =
        document.getElementById("menu");

    if(menu.style.display === "block"){

        menu.style.display = "none";

    }else{

        menu.style.display = "block";
    }
}

</script>

</body>
</html>
