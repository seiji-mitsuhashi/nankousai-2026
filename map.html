<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<title>会場マップ | 南高祭2026</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&display=swap" rel="stylesheet">

<style>

body{

    margin:0;

    font-family:sans-serif;

    background:#f5f7fb;
}

/* ヘッダー */

.page-header{

    background:#00469b;

    padding:15px 30px;

    display:flex;

    justify-content:space-between;

    align-items:center;
}

.site-title{

    color:white;

    text-decoration:none;

    font-size:2rem;

    font-family:
        "Yuji Syuku",
        serif;
}

.site-title:hover{

    color:#ffe066;
}

/* 三本線 */

.menu-button{

    color:white;

    font-size:2rem;

    cursor:pointer;

    transition:0.3s;
}

.menu-button:hover{

    color:yellow;

    transform:scale(1.2);
}

/* メニュー */

#menu{

    display:none;

    background:white;

    position:absolute;

    top:70px;

    right:20px;

    border-radius:12px;

    overflow:hidden;

    box-shadow:
        0 5px 15px rgba(0,0,0,0.2);
}

#menu a{

    display:block;

    padding:15px 30px;

    color:#00469b;

    text-decoration:none;
}

#menu a:hover{

    background:#00469b;

    color:white;
}

/* タイトル */

.page-title{

    text-align:center;

    color:#00469b;

    margin-top:50px;

    font-size:2.5rem;
}

.page-sub{

    text-align:center;

    color:#666;

    margin-top:10px;
}

/* フロア選択 */

.floor-container{

    display:flex;

    justify-content:center;

    gap:40px;

    flex-wrap:wrap;

    margin-top:60px;
}

.floor-card{

    width:250px;

    background:white;

    border-radius:20px;

    padding:40px;

    text-align:center;

    text-decoration:none;

    color:#00469b;

    box-shadow:
        0 5px 15px rgba(0,0,0,0.15);

    transition:0.3s;
}

.floor-card:hover{

    transform:translateY(-8px);

    box-shadow:
        0 10px 25px rgba(0,0,0,0.25);
}

.floor-number{

    font-size:3rem;

    font-weight:bold;
}

.floor-text{

    margin-top:15px;

    font-size:1.2rem;
}

</style>

</head>

<body>

<header class="page-header">

<a href="home.html"
class="site-title">

南高祭2026

</a>

<div
class="menu-button"
onclick="toggleMenu()">

</div>

</header>

<nav id="menu">

</nav>

<h1 class="page-title">

</h1>

<div class="floor-container">

href="3f.html"
class="floor-card">

<div class="floor-number">

</div>

<div class="floor-text">

</div>

</a>

<a
href="4f.html"
class="floor-card">

<div class="floor-number">

4F

</div>

<div class="floor-text">

</div>

<script>

function toggleMenu(){

    const menu =
        document.getElementById("menu");

    if(menu.style.display === "block"){

        menu.style.display = "none";

    }else{

        menu.style.display = "block";
    }
}

</script>

</body>

</html>
