<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>管理者ログイン | 南高祭2026</title>

<style>

body{
    margin:0;
    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    background:#f4f6fb;

    font-family:sans-serif;
}

.login-box{

    background:white;

    padding:40px;

    border-radius:20px;

    box-shadow:
        0 5px 20px rgba(0,0,0,0.15);

    width:350px;

    text-align:center;
}

h1{

    color:#00469b;

    margin-bottom:30px;
}

input{

    width:100%;

    padding:15px;

    font-size:1rem;

    border:1px solid #ccc;

    border-radius:10px;

    margin-bottom:20px;

    box-sizing:border-box;
}

button{

    width:100%;

    padding:15px;

    border:none;

    border-radius:10px;

    background:#00469b;

    color:white;

    font-size:1rem;

    cursor:pointer;

    transition:0.3s;
}

button:hover{

    background:#00357a;
}

.error{

    color:red;

    margin-top:15px;
}

</style>
</head>
<body>

<div class="login-box">

    <h1>管理者ログイン</h1>

    <input
        type="password"
        id="password"
        placeholder="パスワード">

    <button onclick="login()">
        ログイン
    </button>

    <div class="error" id="error"></div>

</div>

<script>

function login(){

    const pass =
        document.getElementById("password").value;

    if(pass === "nankou2026"){

        localStorage.setItem(
            "adminLogin",
            "true"
        );

        location.href = "admin.html";

    }else{

        document.getElementById("error")
            .innerText =
            "パスワードが違います";
    }
}

</script>

</body>
</html>
