<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    display: flex;
    justify-content: center; /* 横中央 */
    align-items: center;     /* 縦中央 */
    background: #f0f0f0;
  }

  .card {
  display: block;
  background: white;
  padding: 20px 30px;
  border-radius: 12px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.1);
  text-align: center;
  font-size: 1.2rem;
  color: #000;
  text-decoration: none;
}

</style>
</head>

<body>
  <a href="https://あなたの公式サイトURL" 
   class="card" 
   target="_blank" 
   rel="noopener noreferrer">
  新しい公式サイトはこちら
</a>

</body>
</html>
